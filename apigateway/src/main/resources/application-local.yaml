spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600
          routes:
            - id: userservice-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**,/api/v1/cards/**
            - id: authservice-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/auth/**
            - id: orderservice-route
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**
            - id: paymentservice-route
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/payments/**