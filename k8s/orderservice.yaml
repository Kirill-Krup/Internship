apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: internship
  labels:
    app: orderservice
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
        tier: backend
    spec:
      initContainers:
        - name: wait-for-orderdb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z orderdb 5432; do echo waiting for orderdb; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
        - name: wait-for-userservice
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z userservice 8081; do echo waiting for userservice; sleep 2; done"]
      containers:
        - name: orderservice
          image: orderservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: 384Mi
              cpu: 200m
            limits:
              memory: 768Mi
              cpu: 500m
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  namespace: internship
  labels:
    app: orderservice
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8083
      targetPort: 8083
  selector:
    app: orderservice
