apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  namespace: internship
  labels:
    app: authservice
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
        tier: backend
    spec:
      initContainers:
        - name: wait-for-authdb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z authdb 5432; do echo waiting for authdb; sleep 2; done"]
        - name: wait-for-userservice
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z userservice 8081; do echo waiting for userservice; sleep 2; done"]
      containers:
        - name: authservice
          image: authservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: 384Mi
              cpu: 200m
            limits:
              memory: 768Mi
              cpu: 500m
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: authservice
  namespace: internship
  labels:
    app: authservice
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app: authservice
