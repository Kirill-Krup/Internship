apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway
  namespace: internship
  labels:
    app: apigateway
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      labels:
        app: apigateway
        tier: gateway
    spec:
      initContainers:
        - name: wait-for-backends
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z userservice 8081; do echo waiting for userservice; sleep 2; done
              until nc -z authservice 8082; do echo waiting for authservice; sleep 2; done
              until nc -z orderservice 8083; do echo waiting for orderservice; sleep 2; done
              until nc -z paymentservice 8084; do echo waiting for paymentservice; sleep 2; done
      containers:
        - name: apigateway
          image: apigateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              memory: 384Mi
              cpu: 200m
            limits:
              memory: 768Mi
              cpu: 500m
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway
  namespace: internship
  labels:
    app: apigateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: apigateway
