name: CI/CD for PaymentService

on:
  push:
    branches:
      - master
      - dev
      - feat-*
  pull_request:

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build project
        run: mvn -B clean compile -DskipTests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RANDOM_API_URL: ${{ secrets.RANDOM_API_URL }}
          SPRING_DATA_MONGO_URL: ${{ secrets.SPRING_DATA_MONGO_URL }}
          SPRING_PROFILES_ACTIVE: local

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: build

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RANDOM_API_URL: ${{ secrets.RANDOM_API_URL }}
          SPRING_DATA_MONGO_URL: ${{ secrets.SPRING_DATA_MONGO_URL }}
          SPRING_PROFILES_ACTIVE: local

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run SonarCloud analysis
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="${SONAR_ORG}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RANDOM_API_URL: ${{ secrets.RANDOM_API_URL }}
          SPRING_DATA_MONGO_URL: ${{ secrets.SPRING_DATA_MONGO_URL }}
          SPRING_PROFILES_ACTIVE: local

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: sonar

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JAR file
        run: mvn -B clean package -DskipTests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RANDOM_API_URL: ${{ secrets.RANDOM_API_URL }}
          SPRING_DATA_MONGO_URL: ${{ secrets.SPRING_DATA_MONGO_URL }}
          SPRING_PROFILES_ACTIVE: docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/paymentservice:latest
            ${{ secrets.DOCKER_USERNAME }}/paymentservice:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max