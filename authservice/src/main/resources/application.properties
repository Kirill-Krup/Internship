spring.application.name=authservice
spring.profiles.active=local
spring.datasource.driver-class-name=org.postgresql.Driver
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

jwt.secret=${JWT_SECRET}
jwt.access-expiration-minutes=15
jwt.refresh-expiration-days=7

server.port=8082

services.user-service.base-url=${USER_SERVICE_BASE_URL}
services.user-service.create-path=/create
services.user-service.delete-path=/{id}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.endpoint.health.group.liveness.include=ping,livenessState
management.endpoint.health.group.readiness.include=ping,readinessState,db