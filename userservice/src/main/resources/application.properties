spring.application.name=userservice
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
server.port=${SERVER_PORT}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.endpoint.health.group.liveness.include=ping,livenessState,redis
management.endpoint.health.group.readiness.include=ping,readinessState,db,redis